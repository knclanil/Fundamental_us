name: Financial repair validation v4.3.1
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'AAPL for pilot, ALL for all tracked companies'
        required: true
        default: 'AAPL'
      apply:
        description: 'Explicitly enable guarded writes (dry-run is default)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: largecap-fundamentals
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: maketdata
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-largecap.txt
      - run: python -m unittest discover -s tests -p 'test_financial_repair_v430.py' -v
      - run: python -m unittest discover -s tests -p 'test_repair_validation_v431.py' -v
      - name: Repair financial records
        env:
          TICKERS: ${{ inputs.tickers }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MONGODB_URI"
          test -n "$SEC_USER_AGENT"
          ARGS=()
          if [ "$APPLY" = 'true' ]; then ARGS+=(--apply); fi
          python -m fundamentals.financial_repair --tickers "$TICKERS" "${ARGS[@]}"
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-repair-v4.3.1
          path: artifacts/financial-repair/
          if-no-files-found: warn
