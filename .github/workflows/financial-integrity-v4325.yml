name: Financial integrity audit and guarded repair v4.3.2.5
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Pilot ticker for repair, e.g. XOM (ALL only after review)'
        required: true
        default: 'XOM'
      run_repair:
        description: 'Run guarded SEC financial repair (dry-run unless apply enabled)'
        type: boolean
        default: false
      apply_repair:
        description: 'Explicitly allow safe financial field writes (requires run_repair)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: largecap-fundamentals
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: maketdata
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-largecap.txt
      - name: Validate audit and identity normalization
        run: |
          python -m unittest discover -s tests -p 'test_quality_audit.py' -v
          python -m unittest discover -s tests -p 'test_identity_audit_v4325.py' -v
      - name: Baseline identity and financial audit (read only)
        run: python -m fundamentals.quality_audit --output artifacts/financial-integrity/before --expected 500
      - name: Optional guarded SEC repair
        if: ${{ inputs.run_repair == true }}
        env:
          TICKERS: ${{ inputs.tickers }}
          APPLY: ${{ inputs.apply_repair }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT"
          ARGS=()
          if [ "$APPLY" = 'true' ]; then ARGS+=(--apply); fi
          python -m fundamentals.financial_repair --tickers "$TICKERS" --output artifacts/financial-integrity/repair "${ARGS[@]}"
      - name: Final identity and financial audit (read only)
        if: ${{ success() }}
        run: python -m fundamentals.quality_audit --output artifacts/financial-integrity/after --expected 500
      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maketdata-financial-integrity-v4.3.2.5
          path: artifacts/financial-integrity/
          if-no-files-found: warn
          retention-days: 30
