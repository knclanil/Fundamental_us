# v4.1.0 2026-11-24: isolated SEC API + EdgarTools / MongoDB workflow.
name: SEC MongoDB v4
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated SEC tickers'
        required: true
        default: 'AAPL,MSFT,GOOGL,AMZN,NVDA,META,BRK-B,JPM,JNJ,XOM'
      limit:
        description: 'Maximum distinct companies'
        required: true
        default: '10'
      refresh_days:
        description: 'Refresh interval'
        required: true
        default: '7'
      edgartools_summary:
        description: 'Optional EdgarTools summary (true/false)'
        required: true
        default: 'false'
permissions:
  contents: read
concurrency:
  group: sec-mongodb-v4
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install v4-only dependencies
        run: python -m pip install -r v4_mongodb/requirements.txt
      - name: Test v4-only modules
        run: python -m unittest discover -s v4_mongodb/tests -p 'test_*.py' -v
      - name: Collect SEC facts into MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MONGODB_DATABASE: maketdata
          TICKERS: ${{ inputs.tickers }}
          LIMIT: ${{ inputs.limit }}
          REFRESH_DAYS: ${{ inputs.refresh_days }}
          EDGARTOOLS_SUMMARY: ${{ inputs.edgartools_summary }}
        run: |
          ARGS=(--tickers "$TICKERS" --limit "$LIMIT" --refresh-days "$REFRESH_DAYS")
          if [ "$EDGARTOOLS_SUMMARY" = 'true' ]; then ARGS+=(--with-edgartools-summary); fi
          python -m v4_mongodb.collector "${ARGS[@]}"
