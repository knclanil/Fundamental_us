name: BlackRock ETF holdings refresh v4.3.2.13
on:
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * 2-6'
permissions:
  contents: read
jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_blackrock_holdings_v43213.py' -v
      - name: Fetch and validate latest complete ETF snapshot
        run: python -m fundamentals.blackrock_holdings --latest --output data/blackrock_holdings_latest.csv
      - name: Upload validated holdings as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackrock-holdings-validated
          path: data/blackrock_holdings_latest.csv
          retention-days: 30
