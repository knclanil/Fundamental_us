name: Automated Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-largecap.txt
            v4_mongodb/requirements.txt

      # Step 3: Install project dependencies
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt \
            -r requirements-largecap.txt \
            -r v4_mongodb/requirements.txt

      # Step 4: Install testing dependencies
      - name: Install testing dependencies
        run: |
          python -m pip install \
            pytest \
            pytest-cov \
            pandas \
            duckdb

      # Step 5: Fix SEC EDGAR API compatibility
      - name: Fix SEC EDGAR rate limiter compatibility
        run: |
          python -m pip install "pyrate-limiter>=2.10,<3"

      # Step 6: Verify installed dependencies
      - name: Verify dependencies
        run: |
          python -m pip check

          python -c "import pandas; print('pandas OK')"
          python -c "import duckdb; print('duckdb OK')"
          python -c "import pymongo; print('pymongo OK')"
          python -c "from sec_edgar_api import EdgarClient; print('SEC EDGAR API OK')"

      # Step 7: Validate Python syntax
      - name: Compile Python source
        run: |
          python -m compileall -q fundamentals tests v4_mongodb

      # Step 8: Run automated tests
      - name: Run all automated tests
        shell: bash
        run: |
          mkdir -p test-artifacts

          set -o pipefail

          python -m pytest \
            -q \
            tests \
            v4_mongodb/tests \
            --junitxml=test-artifacts/pytest-results.xml \
            2>&1 | tee test-artifacts/pytest-output.txt

      # Step 9: Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-results-${{ github.run_number }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 30
