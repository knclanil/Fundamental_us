name: Financial cleanup and SEC recollection v4.3.2
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply company profile cleanup (default false)'
        type: boolean
        required: true
        default: false
      recollect:
        description: 'Run SEC collector for selected tickers after cleanup'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: maketdata-financial-write
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: maketdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-largecap.txt
      - run: python -m unittest discover -s tests -p 'test_v432*.py' -v
      - name: Cleanup universe
        run: |
          if [ '${{ inputs.apply }}' = 'true' ]; then
            python -m fundamentals.cleanup_v432 --apply
          else
            python -m fundamentals.cleanup_v432
          fi
      - name: Recollect affected tickers
        if: ${{ inputs.apply && inputs.recollect }}
        run: |
          echo 'Use the standalone migration --reingest flag only after verifying current SEC ticker mappings. Automatic collection is disabled to avoid failing on delisted symbols.'
