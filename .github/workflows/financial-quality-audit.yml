name: Financial Quality Audit (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: maketdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-largecap.txt
      - run: python -m unittest discover -s tests -p 'test_quality_audit.py' -v
      - name: Generate read-only audit
        run: python -m fundamentals.quality_audit --output artifacts/financial-quality --expected 500
      - name: Upload CSV and JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maketdata-financial-quality-v4.2.1
          path: artifacts/financial-quality/
          if-no-files-found: warn
          retention-days: 30
