name: Q4 financial completion v4.2.2
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (default AAPL); ALL only after review'
        required: true
        default: 'AAPL'
      apply:
        description: 'Explicitly apply guarded MongoDB updates (default dry run)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: largecap-fundamentals
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: maketdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-largecap.txt
      - run: python -m unittest discover -s tests -p 'test_q4_completion_v422.py' -v
      - name: Q4 completion
        env:
          TICKERS: ${{ inputs.tickers }}
          APPLY: ${{ inputs.apply }}
        run: |
          test -n "$MONGODB_URI"
          ARGS=()
          if [ "$APPLY" = 'true' ]; then ARGS+=(--apply); fi
          python -m fundamentals.q4_backfill --tickers "$TICKERS" "${ARGS[@]}"
