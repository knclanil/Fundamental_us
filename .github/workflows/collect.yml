# v3.1.3 - daily batches with durable commits even when a ticker fails.
name: Collect market fundamentals
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Stocks per batch (1-200; use only within provider-approved limits)'
        required: true
        default: '100'
        type: choice
        options: ['25', '50', '100', '200']
      batches:
        description: 'Number of batches in this run (1-20)'
        required: true
        default: '1'
        type: choice
        options: ['1', '5', '10', '20']
  schedule:
    - cron: '15 3 * * *' # Daily 03:15 UTC; scheduled runs use 100 stocks.
permissions:
  contents: write
concurrency:
  group: market-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect and checkpoint each batch
        env:
          MARKET_MAX_TICKERS: ${{ github.event.inputs.batch_size || '100' }}
          BATCHES: ${{ github.event.inputs.batches || '1' }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ((i=1; i<=BATCHES; i++)); do
            echo "::group::Batch $i/$BATCHES"
            set +e
            python -u src/pipeline.py
            status=$?
            set -e
            # The checkpoint is written to disk before any push.
            # Artifacts are uploaded in a separate always() step, even on failure.
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "data: checkpoint fundamentals batch $i/$BATCHES"
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "::error::Data conflict. Restore from workflow artifact; refusing to overwrite remote Parquet."
                  exit 1
                fi
                if git push origin HEAD:main; then break; fi
                if (( attempt == 3 )); then
                  echo "::error::Push rejected; artifact backup available. Do not force push."
                  exit 1
                fi
                sleep 10
              done
            fi
            echo "::endgroup::"
            if (( status != 0 )); then exit "$status"; fi
          done
      - name: Backup all collected data and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/
          if-no-files-found: warn
          retention-days: 30
