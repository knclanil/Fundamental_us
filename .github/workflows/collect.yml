# v3.1.2 - daily rotating batches and optional manual catch-up.
name: Collect market fundamentals
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Stocks per batch (1-200; use only within provider-approved limits)'
        required: true
        default: '100'
        type: choice
        options: ['25', '50', '100', '200']
      batches:
        description: 'Number of batches in this run (1-20)'
        required: true
        default: '1'
        type: choice
        options: ['1', '5', '10', '20']
  schedule:
    - cron: '15 3 * * *' # Daily 03:15 UTC; scheduled runs use 100 stocks.
permissions:
  contents: write
concurrency:
  group: market-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect and checkpoint each batch
        env:
          MARKET_MAX_TICKERS: ${{ github.event.inputs.batch_size || '100' }}
          BATCHES: ${{ github.event.inputs.batches || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ((i=1; i<=BATCHES; i++)); do
            echo "::group::Batch $i/$BATCHES ($MARKET_MAX_TICKERS tickers)"
            # Fail on genuine errors; save successful batches individually.
            python -u src/pipeline.py
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "data: refresh fundamentals batch $i/$BATCHES"
              git push
            fi
            echo "::endgroup::"
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics-${{ github.run_id }}
          path: data/execution_log_latest.csv
          if-no-files-found: warn
