name: Large-cap fundamentals v4.1
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum companies per run
        required: true
        default: '10'
      refresh_days:
        description: Refresh interval in days
        required: true
        default: '7'
  schedule:
    - cron: '15 5 * * 1'
permissions:
  contents: read
concurrency:
  group: largecap-fundamentals
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      MONGODB_DATABASE: maketdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-largecap.txt
      - run: python -m unittest discover -s tests -p 'test_largecap.py' -v
      - name: Collect large caps
        env:
          LIMIT: ${{ github.event.inputs.limit || '100' }}
          REFRESH_DAYS: ${{ github.event.inputs.refresh_days || '7' }}
        run: |
          test -n "$MONGODB_URI" && test -n "$SEC_USER_AGENT"
          python -m fundamentals.collect --limit "$LIMIT" --refresh-days "$REFRESH_DAYS" --years 5
